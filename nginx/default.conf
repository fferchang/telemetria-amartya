# nginx: sirve la interfaz y hace de proxy hacia la API.
#
# NO VERIFICADA TODAVIA (ver la nota del Dockerfile).
#
# POR QUE LAS DOS COSAS EN EL MISMO SERVIDOR Y NO CADA UNA POR SU LADO: para el
# navegador queda un solo origen, asi que no hay CORS que configurar ni
# preflights que debuggear. Es el mismo patron que usa el dashboard de Casa
# Rosada, donde ademas sirve para que el token de InfluxDB no llegue nunca al
# browser.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir. Un historico de 7 dias son ~40 KB de JSON que bajan a ~5 KB, y
    # del otro lado hay un telefono con señal de campo.
    gzip on;
    gzip_types application/json application/javascript text/css text/html;
    gzip_min_length 512;

    # ---- La API ----
    location /api/ {
        # SIN barra final en el proxy_pass, y esto no es un detalle de estilo:
        # con barra (`http://api:8000/`) nginx REEMPLAZA el prefijo /api/ y la
        # request llega a Flask como /estado, que no existe -> 404. Sin barra,
        # pasa la ruta completa (/api/estado), que es como estan declaradas las
        # rutas en app.py.
        proxy_pass http://api:8000;

        proxy_set_header Host $host;
        # Sin esto, la API ve a nginx como cliente de todas las requests y el
        # limitador de tasa cuenta todo junto en una sola clave.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las respuestas de la API NUNCA se cachean: son el estado actual del
        # tanque. Un `/api/estado` cacheado muestra el nivel de hace una hora
        # con cara de dato fresco.
        add_header Cache-Control "no-store" always;
    }

    # ---- index.html ----
    # Nunca se cachea, y es la pieza clave de todo el esquema de versionado: es
    # el unico archivo que contiene los `?v=N` de los demas. Si el navegador se
    # guarda un index.html viejo, sigue pidiendo style.css?v=3 y app.js?v=7 para
    # siempre, y ningun deploy le llega nunca.
    #
    # SON DOS BLOQUES Y NO UNO. `location = /index.html` matchea solo la ruta
    # escrita entera; entrar a la raiz (`/`) cae en `location /`, que resuelve
    # el index por la directiva `index` y le aplicaria el cache de 7 dias. O
    # sea: justo la forma en que entra todo el mundo seria la unica que se
    # queda pegada a la version vieja.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # ---- El resto de los estaticos ----
    # Estos SI se cachean fuerte, justamente porque van versionados por query
    # string desde index.html: si cambia el contenido, cambia la URL. Es lo que
    # hace que la pagina cargue rapido en una conexion mala sin quedarse pegada
    # a una version vieja.
    #
    # Solo `expires`, sin un add_header de Cache-Control al lado: `expires` ya
    # emite ese header, y poner los dos manda la cabecera repetida.
    location / {
        try_files $uri $uri/ =404;
        expires 7d;
    }

    # No anunciar la version de nginx en los headers de error.
    server_tokens off;
}
